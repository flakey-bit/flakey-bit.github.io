---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  <script src="https://utteranc.es/client.js"
  repo="flakey-bit/flakey-bit.github.io"
  issue-term="pathname"
  theme="github-dark"
  crossorigin="anonymous"
  async>
</script>
</article>
